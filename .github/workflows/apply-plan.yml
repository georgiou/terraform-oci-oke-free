# Reusable workflow, called from a consumer's manual `apply` workflow:
#   uses: OWNER/oci-oke-free/.github/workflows/apply-plan.yml@<ref>
# Applies exactly the plan a `tofu` run uploaded, at that run's commit and
# library version, via `make ci-apply`. Starting the workflow is the approval
# (works on every GitHub plan); required reviewers on "production" add a gate.
name: apply-plan

on:
  workflow_call:
    inputs:
      run_id: { type: string, required: true, description: "tofu workflow run that produced the plan" }
      stack: { type: string, default: cluster, description: "Root under stacks/" }
      tenancy_ocid: { type: string, required: true, description: "vars.OCI_TENANCY_OCID" }
      region: { type: string, required: true, description: "vars.OCI_REGION" }
    secrets:
      STATE_PASSPHRASE: { required: false }
      STATE_S3_ACCESS_KEY_ID: { required: false }
      STATE_S3_SECRET_ACCESS_KEY: { required: false }
      TOFU_SETTINGS: { required: false }
      OCI_APPLY_USER_OCID: { required: false }
      OCI_APPLY_FINGERPRINT: { required: false }
      OCI_APPLY_KEY_PEM: { required: false }

permissions:
  contents: read
  actions: read

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_IN_AUTOMATION: "1"
      STACK: ${{ inputs.stack }}
      OCI_TENANCY_OCID: ${{ inputs.tenancy_ocid }}
      OCI_REGION: ${{ inputs.region }}
      TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.STATE_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_S3_SECRET_ACCESS_KEY }}
      TOFU_SETTINGS: ${{ secrets.TOFU_SETTINGS }}
      OCI_APPLY_USER_OCID: ${{ secrets.OCI_APPLY_USER_OCID }}
      OCI_APPLY_FINGERPRINT: ${{ secrets.OCI_APPLY_FINGERPRINT }}
      OCI_APPLY_KEY_PEM: ${{ secrets.OCI_APPLY_KEY_PEM }}
    steps:
      - id: run
        name: Locate the plan's commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::run_id must be numeric'; exit 1; }
          info=$(gh run view "$RUN_ID" --json headSha,headBranch,event,workflowDatabaseId)
          workflow_id=$(jq -er .workflowDatabaseId <<<"$info")
          [ "$(gh api "repos/$GH_REPO/actions/workflows/$workflow_id" --jq .path)" = '.github/workflows/tofu.yml' ] || { echo '::error::not a tofu workflow run'; exit 1; }
          [ "$(jq -r .headBranch <<<"$info")" = main ] || { echo "::error::only plans made on main can be applied"; exit 1; }
          case "$(jq -r .event <<<"$info")" in push|workflow_dispatch) ;; *) echo "::error::run $RUN_ID is not a deploy run"; exit 1;; esac
          echo "sha=$(jq -r .headSha <<<"$info")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.run.outputs.sha }}
      - id: ver
        run: echo "version=$(cat .opentofu-version)" >> "$GITHUB_OUTPUT"
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ steps.ver.outputs.version }}
          tofu_wrapper: false
      - name: Settings from secret (only if not committed)
        run: '[ -f config/settings.tfvars ] || [ -z "$TOFU_SETTINGS" ] || printf "%s\n" "$TOFU_SETTINGS" > config/settings.tfvars'
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.stack }}
          path: .ci
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Apply the saved plan (redacted)
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          ref=$(cat .ci/module_ref)
          [[ "$ref" =~ ^([0-9a-f]{40}|v[0-9]+\.[0-9]+\.[0-9]+)$ ]]
          make "LIB_REF=$ref" ci-apply
          echo "### $STACK applied from run $RUN_ID (library $(cat .ci/module_ref))" >> "$GITHUB_STEP_SUMMARY"
