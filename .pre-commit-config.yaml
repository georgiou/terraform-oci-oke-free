repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt
        entry: tofu fmt -recursive -check -diff
        language: system
        pass_filenames: false
        files: \.(tf|tftest\.hcl)$
      - id: tofu-test
        name: tofu test (modules + template)
        entry: bash -c "make test && make validate-template"
        language: system
        pass_filenames: false
        files: ^(modules|templates|tests)/
