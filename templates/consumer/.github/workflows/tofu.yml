# Thin caller: all logic lives in the library's reusable workflow, pinned to
# the same version as your modules (Renovate bumps both in one PR).
name: tofu

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *" # nightly drift check

permissions:
  contents: read
  issues: write # drift issues

concurrency:
  group: tofu-state
  cancel-in-progress: false

jobs:
  cluster:
    # Pull requests from forks get no secrets: skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: UPSTREAM_OWNER/UPSTREAM_REPO/.github/workflows/stack.yml@UPSTREAM_REF
    with:
      stack: cluster
      mode: ${{ github.event_name == 'schedule' && 'drift' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'deploy' || 'plan') }}
      tenancy_ocid: ${{ vars.OCI_TENANCY_OCID }}
      region: ${{ vars.OCI_REGION }}
      auto_apply: ${{ vars.AUTO_APPLY || 'off' }}
    secrets:
      STATE_PASSPHRASE: ${{ secrets.STATE_PASSPHRASE }}
      STATE_S3_ACCESS_KEY_ID: ${{ secrets.STATE_S3_ACCESS_KEY_ID }}
      STATE_S3_SECRET_ACCESS_KEY: ${{ secrets.STATE_S3_SECRET_ACCESS_KEY }}
      OCI_PLAN_USER_OCID: ${{ secrets.OCI_PLAN_USER_OCID }}
      OCI_PLAN_FINGERPRINT: ${{ secrets.OCI_PLAN_FINGERPRINT }}
      OCI_PLAN_KEY_PEM: ${{ secrets.OCI_PLAN_KEY_PEM }}
      TOFU_SETTINGS: ${{ secrets.TOFU_SETTINGS }}
