# Thin caller: all logic lives in the library's reusable workflow, pinned to
# the same version as your modules (Renovate bumps both in one PR).
name: tofu

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *" # nightly drift check

permissions:
  contents: read
  issues: write # drift issues

concurrency:
  group: tofu-state
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: version
        run: echo "tofu=$(cat .opentofu-version)" >> "$GITHUB_OUTPUT"
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ steps.version.outputs.tofu }}
          tofu_wrapper: false
      - run: tofu fmt -recursive -check -diff
  cluster:
    if: vars.OCI_CI_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: UPSTREAM_OWNER/UPSTREAM_REPO/.github/workflows/stack.yml@UPSTREAM_REF
    with:
      stack: cluster
      mode: ${{ github.event_name == 'schedule' && 'drift' || 'deploy' }}
      tenancy_ocid: ${{ vars.OCI_TENANCY_OCID }}
      region: ${{ vars.OCI_REGION }}
      auto_apply: ${{ vars.AUTO_APPLY || 'off' }}
