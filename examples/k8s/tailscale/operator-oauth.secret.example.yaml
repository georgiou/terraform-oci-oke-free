# DO NOT commit real values. Encrypt with SOPS, or create via External Secrets.
# The chart uses this pre-existing secret when oauth.clientId/clientSecret are
# left unset in the Helm values, so no credential ends up in the ArgoCD app.
apiVersion: v1
kind: Secret
metadata:
  name: operator-oauth
  namespace: tailscale
stringData:
  client_id: "<oauth-client-id>"
  client_secret: "<oauth-client-secret>"
