# Callers granted the "tailnet-admins" group in tailnet-policy.hujson get
# cluster-admin. Add narrower bindings for other tailnet groups as needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tailnet-admins
subjects:
  - kind: Group
    name: tailnet-admins
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
